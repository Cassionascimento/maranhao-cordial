<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<title>Maranhão Cordial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fundo:#0b0a08;--cartao:#14110d;--linha:rgba(212,175,55,.28);--ouro:#d4af37;--creme:#f4ece1;--suave:#b9ad9a}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--creme);font:16px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
a{color:inherit}
header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:20px clamp(18px,5vw,48px);background:rgba(11,10,8,.9);backdrop-filter:blur(8px);z-index:10}
.pr-logo{display:flex;flex-direction:column;line-height:1.05;text-decoration:none}
.pr-logo b{font:600 16px "Cormorant Garamond",serif;letter-spacing:4px;text-transform:uppercase}
.pr-logo span{font-size:8px;letter-spacing:3px;color:var(--ouro);text-transform:uppercase;margin-top:2px}
header a.voltar{font:500 12px Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--ouro);text-decoration:none;border:1px solid rgba(212,175,55,.4);padding:8px 16px;border-radius:6px}
main{max-width:960px;margin:0 auto;padding:24px 18px 80px}
.pr-corpo{display:grid;gap:32px}
@media (min-width:760px){.pr-corpo{grid-template-columns:1fr 1fr;align-items:start}}
.pr-midia{width:100%;aspect-ratio:1/1;background:var(--cartao);border:1px solid var(--linha);overflow:hidden;display:flex;align-items:center;justify-content:center}
.pr-midia img,.pr-midia video{width:100%;height:100%;object-fit:cover;display:block}
.pr-eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ouro);margin:0 0 10px}
h1{font:500 clamp(1.8rem,6vw,2.4rem)/1.15 "Cormorant Garamond",Georgia,serif;margin:0 0 12px}
.pr-preco{font-size:1.1rem;color:var(--ouro);margin:0 0 16px}
.pr-curta{color:var(--suave);margin:0 0 18px}
.pr-completa{white-space:pre-line;margin:0 0 22px}
.pr-ficha{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:8px;font-size:.9rem;color:var(--suave)}
.pr-ficha b{color:var(--creme);font-weight:500}
.pr-disponibilidade{display:inline-block;font-size:.82rem;letter-spacing:.5px;color:var(--ouro);border:1px solid rgba(212,175,55,.4);border-radius:999px;padding:5px 14px;margin:0 0 20px}
.pr-cta{display:inline-block;min-height:48px;line-height:48px;padding:0 28px;background:var(--ouro);color:#15110a;font:600 .95rem Inter,sans-serif;text-decoration:none;border-radius:10px}
.pr-cta.secundario{background:transparent;color:var(--creme);border:1px solid var(--linha)}
.pr-embreve{color:var(--suave);font-size:.9rem}
.pr-erro{padding:80px 20px;text-align:center;color:var(--suave)}
.pr-carregando{padding:80px 20px;text-align:center;color:var(--suave)}
</style>
</head>
<body>
<header>
  <a class="pr-logo" href="/">
    <b>Maranhão</b>
    <span>Cordial</span>
  </a>
  <a class="voltar" href="/compreaqui.html">Ver todos os produtos</a>
</header>
<main id="raiz">
  <p class="pr-carregando">Carregando produto…</p>
</main>
<script src="/produto-pagina.js"></script>
</body>
</html>
