<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maranhão Cordial</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}

body{

    background:
    radial-gradient(circle at 75% 45%,
    rgba(181,96,22,.35) 0%,
    rgba(70,35,10,.18) 28%,
    #050505 75%);

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 8vw;

}

/* ---------- CARD ---------- */

.card{

    width:430px;

    padding:60px;

    border-radius:28px;

    background:rgba(15,15,15,.18);

    backdrop-filter:blur(16px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 25px 70px rgba(0,0,0,.55);

    z-index:3;

}

h1{

    color:#efe7d5;

    font-weight:200;

    font-size:54px;

    letter-spacing:5px;

    margin-bottom:30px;

    line-height:1.1;

}

p{

    color:rgba(255,255,255,.72);

    line-height:1.8;

    font-size:18px;

    margin-bottom:45px;

}

input{

    width:100%;

    background:transparent;

    border:none;

    border-bottom:1px solid rgba(255,255,255,.25);

    color:white;

    font-size:20px;

    padding:18px 5px;

    outline:none;

}

input::placeholder{

    color:rgba(255,255,255,.45);

    letter-spacing:1px;

}

input:focus{

    border-color:#c59a57;

}

small{

    display:block;

    margin-top:25px;

    color:rgba(255,255,255,.45);

    letter-spacing:2px;

    text-transform:uppercase;

    font-size:11px;

}

/* ---------- GARRAFA ---------- */

.garrafa{

    position:absolute;

    right:3vw;

    bottom:0;

    height:88vh;

    z-index:2;

    filter:

        drop-shadow(0 0 90px rgba(185,108,28,.45))

        brightness(1.03)

        contrast(1.05);

    user-select:none;

    pointer-events:none;

}

/* brilho atrás */

.luz{

    position:absolute;

    right:10vw;

    width:700px;

    height:700px;

    border-radius:50%;

    background:radial-gradient(circle,
    rgba(183,92,16,.30) 0%,
    rgba(183,92,16,.08) 40%,
    transparent 75%);

    filter:blur(80px);

    z-index:1;

}

/* RESPONSIVO */

@media(max-width:900px){

body{

    justify-content:center;

    padding:40px;

}

.garrafa{

    opacity:.20;

    right:-120px;

    height:95vh;

}

.card{

    width:100%;
    max-width:420px;

}

}

</style>

</head>

<body>

<div class="luz"></div>

<div class="card">



<p>

Bem-vindo.

<br><br>

Cada cidade revela sabores,
histórias e encontros únicos.

<br><br>

Digite sua cidade para começar sua experiência.

</p>

<input

id="cidade"

type="text"

placeholder="Digite sua cidade"

autocomplete="off">

<small>

Pressione ENTER para continuar

</small>

</div>

<img
class="garrafa"
src="394EFCB5-2527-4C77-8A63-C74EE1E2ED0E.png"
alt="Maranhão Cordial">

<script>

const campo=document.getElementById("cidade");

campo.focus();

campo.addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        window.location.href="home.html";

    }

});

</script>

</body>
</html>
