<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rede Profissional | Maranhão Cordial</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#081016;color:#f3efe7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.page{width:min(620px,calc(100% - 28px));margin:auto;padding:42px 0 70px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.55}
h1{font-size:clamp(28px,6vw,42px);font-weight:500;letter-spacing:-.03em;margin:9px 0}
.intro{opacity:.66;line-height:1.55;font-size:14px;margin:0 0 28px}
.card{border:1px solid rgba(243,239,231,.11);border-radius:16px;padding:20px;background:rgba(255,255,255,.018)}
.field{margin-bottom:15px}
label{display:block;font-size:11px;opacity:.65;margin-bottom:6px}
input,textarea{width:100%;border:1px solid rgba(243,239,231,.13);border-radius:10px;background:#0d171e;color:#f3efe7;padding:12px;font-size:14px;outline:none}
textarea{min-height:82px;resize:vertical}
details{margin-top:8px;border-top:1px solid rgba(243,239,231,.08);padding-top:14px}
summary{cursor:pointer;font-size:12px;opacity:.7}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#f3efe7;color:#081016;font-weight:700;cursor:pointer}
button:disabled{opacity:.45}
#resultado{display:none;margin-top:14px;padding:13px;border-radius:10px;font-size:13px;line-height:1.5}
#resultado.ok{display:block;background:rgba(70,150,100,.08);border:1px solid rgba(130,220,160,.3)}
#resultado.erro{display:block;background:rgba(170,50,50,.08);border:1px solid rgba(240,120,120,.3)}
.micro{font-size:11px;opacity:.48;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<div class="page">
<div class="eyebrow">Maranhão Cordial · Rede Profissional</div>
<h1>Entre para a nossa rede</h1>
<p class="intro">Leva menos de 1 minuto. A IA Empresarial organiza e complementa o cadastro depois.</p>
<form id="formProfissional" class="card">
<div class="field"><label>Seu nome *</label><input name="nome" required autocomplete="name"></div>
<div class="field"><label>O que você faz?</label><input name="cargo_funcao" placeholder="Ex.: bartender, chef, bar, restaurante, hotel..."></div>
<div class="field"><label>Instagram</label><input name="instagram" placeholder="@perfil"></div>
<div class="field"><label>WhatsApp</label><input name="whatsapp" placeholder="(00) 00000-0000"></div>
<details>
<summary>Adicionar mais informações (opcional)</summary>
<div class="field" style="margin-top:15px"><label>Onde você atua?</label><input name="estabelecimento_nome" placeholder="Bar, restaurante, hotel, projeto ou empresa"></div>
<div class="field"><label>Cidade</label><input name="cidade"></div>
<div class="field"><label>UF</label><input name="estado" maxlength="2" placeholder="SP"></div>
<div class="field"><label>E-mail</label><input name="email" type="email"></div>
<div class="field"><label>Algo que queira nos contar?</label><textarea name="observacoes" placeholder="Interesse, ideia, parceria ou contexto."></textarea></div>
</details>
<button id="btnEnviar" type="submit">ENVIAR</button>
<div id="resultado"></div>
<div class="micro">Você não precisa preencher tudo. O sistema completa o relacionamento ao longo do tempo.</div>
</form>
</div>
<script>
const form=document.getElementById("formProfissional"),btn=document.getElementById("btnEnviar"),resultado=document.getElementById("resultado");
function clean(v){v=String(v||"").trim();return v||null}
form.addEventListener("submit",async(e)=>{
e.preventDefault();const fd=new FormData(form),dados={};for(const[k,v]of fd.entries())dados[k]=clean(v);
if(!dados.instagram&&!dados.whatsapp&&!dados.email){resultado.className="erro";resultado.textContent="Informe Instagram, WhatsApp ou e-mail.";return}
btn.disabled=true;btn.textContent="ENVIANDO...";resultado.className="";resultado.style.display="none";
try{const r=await fetch("/api/parceiros/profissionais/cadastro",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(dados)});const data=await r.json();if(!r.ok)throw new Error(data.error||"Não foi possível enviar.");resultado.className="ok";resultado.innerHTML="<strong>Recebido.</strong><br>Seu cadastro entrou na rede da Maranhão Cordial.";form.reset();}
catch(err){resultado.className="erro";resultado.textContent=err.message}
finally{btn.disabled=false;btn.textContent="ENVIAR"}
});
</script>
</body>
</html>
